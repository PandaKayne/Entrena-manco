#ov{z-index:20}#play{z-index:30}#ov.show{display:block}#play.show{display:flex}
.q{font-size:34px;margin:6px 0 16px}

.phase{font:800 22px "Barlow Condensed",sans-serif;color:var(--acc)}
.name{font-size:44px;margin:6px 0 8px}.how{color:var(--mut);font-size:18px}
.time{font:800 96px/1 "Barlow Condensed",sans-serif;text-align:center;margin:auto 0}
.fig{width:100%;max-height:210px;margin:10px 0;color:var(--ink)}

.ring{position:relative;width:190px;height:190px;border-radius:50%;margin:30px auto;display:grid;place-items:center;background:conic-gradient(var(--acc) 0%,var(--line) 0)}
.ring::before{content:"";position:absolute;inset:16px;background:var(--bg);border-radius:50%}.ring b{position:relative;font:800 46px "Barlow Condensed",sans-serif}
.gen{text-align:center}.gen ul{list-style:none;padding:0;text-align:left}.gen li{padding:4px 0}

.big{font-size:80px;text-align:center}.fin{text-align:center;padding-top:60px}
.cf{position:fixed;top:-30px;font-size:26px;z-index:40;animation:cf 2.4s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}

</style>

 a.forEach(function(x,i){h+='<button class="d'+(hechoEl(x.s)?" done":"")+(x.train?"":" rest")+(x.s==ds(new Date())?" hoy":"")+'" data-a="pd" data-v="'+i+'">'+x.n+'<small>'+(x.train?zn(x.zona).n.slice(0,5):"—")+'</small></button>'});
 return h+'</div>'}
function prog(){var f=S.log.map(function(l){return l.f}),u=f.filter(function(v,i){return f.indexOf(v)==i}),min=0,kc=0,r=streak(),ini=dn(plan()[0].s),wk=u.filter(function(s){return dn(s)>=ini}).length;
 S.log.forEach(function(l){min+=l.m;kc+=l.k||0});
 var B=[["🌱","Primer entreno",S.log.length>=1],["🔥","3 días seguidos",r>=3],["🔟","10 entrenos",S.log.length>=10],["⏱️","100 minutos",min>=100],["🏆","Meta semanal",wk>=S.dias],["⚖️","Registraste peso",S.pesos.length>0]];
 var h='<h1 style="font-size:36px">Tu progreso</h1><div class="stats"><div class="st"><b>'+S.log.length+'</b>entrenos</div><div class="st"><b>'+r+'</b>días seguidos</div><div class="st"><b>'+min+'</b>minutos</div><div class="st"><b>'+kc+'</b>kcal aprox.</div></div>'+
 '<h2>Meta de la semana</h2><div class="bar"><i style="width:'+Math.min(100,wk/S.dias*100)+'%"></i></div><p class="mut">'+wk+' de '+S.dias+' entrenos</p><h2>Logros</h2><div class="badges">'+B.map(function(b){return '<div class="bd'+(b[2]?"":" off")+'"><span>'+b[0]+'</span>'+b[1]+'</div>'}).join("")+'</div><h2>Peso e IMC</h2>';
 var k=lastKg();
 if(k&&S.alt){var m=S.alt/100,im=k/(m*m),c=im<18.5?"bajo peso":im<25?"rango normal":im<30?"sobrepeso":"obesidad";h+='<div class="card"><b>'+k+' kg · IMC '+im.toFixed(1)+'</b> ('+c+')<br><span class="mut">Solo es una referencia: no distingue músculo de grasa.</span></div>'}
 else h+='<p class="mut">Anota tu peso para ver tu IMC y tu gráfica.</p>';
 if(S.pesos.length>1){var ps=S.pesos.slice(-12),mn=Math.min.apply(null,ps.map(function(p){return p.k})),mx=Math.max.apply(null,ps.map(function(p){return p.k}))+.001,pts=ps.map(function(p,i){return(10+i*(280/(ps.length-1)))+","+(80-(p.k-mn)/(mx-mn)*65)}).join(" ");
  h+='<svg viewBox="0 0 300 90" style="width:100%;color:var(--acc)"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
 return h+'<input id="nw" type="number" step="0.1" placeholder="Peso de hoy (kg)" inputmode="decimal"><button class="wide" data-a="aw">Guardar peso</button>'}
function ajus(){return '<h1 style="font-size:36px">Ajustes</h1><h2>Nivel</h2><div class="seg">'+NIV.map(function(n,i){return '<button class="'+(i==S.nivel?"on":"")+'" data-a="niv" data-v="'+i+'">'+"⚡".repeat(i+1)+' '+n.n+'</button>'}).join("")+'</div>'+
 '<h2>Descanso entre ejercicios</h2><select id="rs">'+[["","Automático"],[5,"5 s"],[10,"10 s"],[15,"15 s"],[20,"20 s"],[30,"30 s"],[45,"45 s"],[60,"60 s"]].map(function(o){return '<option value="'+o[0]+'"'+(String(S.rest==null?"":S.rest)==String(o[0])?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'+
 '<button class="wide" data-a="voz">Voz: '+(S.voz?"sí":"no")+'</button><button class="wide" data-a="ed">Editar mi rutina</button><button class="wide" data-a="re">Rehacer configuración inicial</button><button class="wide" data-a="del">Borrar mis datos</button><p class="mut">Tus datos se guardan solo en este teléfono. Si algo te duele, para. Calienta antes y bebe agua.</p>'}
/* sesiones */
function sess(list){var n=NIV[S.nivel],r=S.rest!=null?S.rest:n.r+(S.obj=="peso"?-5:S.obj=="musculo"?5:0),o=[];r=Math.max(5,r);
 WU.forEach(function(e){o.push({n:e[0],h:e[1],p:e[2],w:30,r:3,f:"Calentamiento"})});
 list.forEach(function(e){o.push({n:e[0],h:e[1],p:e[2],w:n.w,r:r,f:"Ejercicio"})});
 SS.forEach(function(e){o.push({n:e[0],h:e[1],p:e[2],w:20,r:3,f:"Estiramiento"})});
 o[o.length-1].r=0;return o}
function zl(k,seed){return shuf(zn(k).e.filter(ok),rng(seed+k)).slice(0,[5,6,7][S.nivel])}
function ov(h){$("ov").innerHTML=h;$("ov").className="show";$("ov").scrollTop=0}
function cl(){$("ov").className=""}
function conf(){for(var i=0;i<24;i++){var s=document.createElement("span");s.className="cf";s.textContent=["🎉","💪","🔥","⭐"][i%4];s.style.left=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*.8)+"s";document.body.appendChild(s);setTimeout(function(e){e.remove()},3500,s)}}
/* configuración inicial */
var STP=0;
function ob(){var s=OB[STP],h='<div class="top"><button class="ic" data-a="back">←</button><div class="bar" style="flex:1;margin:0 12px"><i style="width:'+((STP+1)/OB.length*100)+'%"></i></div><button class="ic" data-a="skip">Omitir</button></div><h2 class="q">'+s.q+'</h2>';
 if(s.k=="dias"){h+='<div class="seg">'+[1,2,3,4,5,6,7].map(function(n){return '<button class="'+(n==S.dias?"on":"")+'" data-a="dd" data-v="'+n+'">'+n+'</button>'}).join("")+'</div><p class="mut">Recomendamos al menos 3 veces a la semana.</p><b>Primer día de la semana</b><select id="ini">'+["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"].map(function(d,i){return '<option value="'+i+'"'+(i==S.ini?" selected":"")+'>'+d+'</option>'}).join("")+'</select>'}
 else if(s.k=="cuerpo")h+='<p class="mut">Es opcional. Se queda solo en tu teléfono.</p><label>Peso (kg)<input id="kg" type="number" step="0.1" inputmode="decimal" value="'+(lastKg()||"")+'"></label><label>Altura (cm)<input id="cm" type="number" inputmode="numeric" value="'+(S.alt||"")+'"></label>';
 else h+=s.o.map(function(o){var on=s.multi?(o[0]===""?S.mol.length==0:S.mol.indexOf(o[0])>-1):String(S[s.k])===String(o[0]);return '<button class="opt'+(on?" on":"")+'" data-a="o" data-v="'+o[0]+'">'+o[1]+(o[2]?'<small>'+o[2]+'</small>':"")+'</button>'}).join("");
 ov(h+'<button class="wide main" data-a="nx">'+(STP==OB.length-1?"Obtener mi plan":"Siguiente")+'</button>')}
function gen(){var p=0,L=["Analiza tu cuerpo"+(S.alt?": "+S.alt+" cm":""),"Ajusta tu nivel: "+NIV[S.nivel].n,"Prepara tus días: "+S.dias+" por semana","Elige ejercicios para: "+zn(S.zona).n];
 ov('<div class="gen"><h1>Generando el plan para ti</h1><div class="ring" id="rg"><b id="pc">0%</b></div><ul id="gl"></ul></div>');
 var iv=setInterval(function(){p+=4;var q=Math.min(p,100);$("pc").textContent=q+"%";$("rg").style.background="conic-gradient(var(--acc) "+q+"%,var(--line) 0)";
  $("gl").innerHTML=L.slice(0,Math.min(4,Math.floor(q/25)+1)).map(function(x){return '<li>✅ '+x+'</li>'}).join("");
  if(p>=100){clearInterval(iv);S.ob=true;S.tab=0;save();cl();R()}},120)}
function bld(){var h='<div class="top"><h2>Mi rutina</h2><button class="ic" data-a="cl">Cerrar</button></div><p class="mut">Marca los ejercicios que quieres. Se guarda en este teléfono.</p>';
 G.forEach(function(g,gi){h+='<h3>'+g.n+'</h3>';g.e.forEach(function(e,i){var id=gi+"."+i;h+='<label class="ck"><input type="checkbox" value="'+id+'"'+(S.custom.indexOf(id)>-1?" checked":"")+'> '+e[0]+' <span class="mut">'+"⚡".repeat(e[3]+1)+'</span></label>'})});
 ov(h+'<button class="wide main" data-a="bs">Guardar y empezar</button>')}
function cust(){return S.custom.map(function(id){var p=id.split(".");return G[+p[0]].e[+p[1]]})}
/* entrenamiento */
var W=null,T=null,WL=null;
function say(t){if(!S.voz||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="es-419";speechSynthesis.speak(u)}catch(e){}}
function beep(f,d){try{var A=window.AC||(window.AC=new(window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}}
function go(list,meta){if(!list.length){alert("No encontré ejercicios con esa zona y tus molestias. Prueba otra zona o cambia tus molestias en Ajustes.");return}
 W={ex:sess(list),i:0,ph:"w",pause:false,ini:Date.now(),meta:meta};W.t=W.ex[0].w;$("play").className="show";$("pausa").textContent="Pausa";FK=null;show();say(W.ex[0].n+". "+W.ex[0].h);beep(880,.2);
 try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){WL=l}).catch(function(){})}catch(e){}
 clearInterval(T);T=setInterval(tick,1000)}
function show(){var e=W.ex[W.i],w=W.ph=="w",nx=w?e:W.ex[W.i+1];
 $("cuenta").textContent=e.f+" · "+(W.i+1)+"/"+W.ex.length;$("fase").textContent=w?"Hazlo":"Descansa";
 $("nombre").textContent=w?e.n:"Sigue: "+nx.n;$("como").textContent=nx.h;$("tiempo").textContent=W.t;
 $("barra").style.width=((W.i+(w?0:1))/W.ex.length*100)+"%";fig(nx.p)}
function next(){var e=W.ex[W.i];
 if(W.ph=="w"){if(W.i==W.ex.length-1){fin();return}
  if(e.r>0){W.ph="r";W.t=e.r;say("Descansa. Sigue "+W.ex[W.i+1].n)}else{W.i++;W.t=W.ex[W.i].w;say(W.ex[W.i].n)}}
 else{W.i++;W.ph="w";W.t=W.ex[W.i].w;say(W.ex[W.i].n+". "+W.ex[W.i].h);beep(880,.2)}
 try{if(navigator.vibrate)navigator.vibrate(120)}catch(x){}show()}
function tick(){if(!W||W.pause)return;W.t--;$("tiempo").textContent=W.t;if(W.t>0&&W.t<4){beep(520,.08);if(S.voz&&window.speechSynthesis)say(String(W.t))}if(W.t<=0)next()}
function fin(){clearInterval(T);var m=Math.max(1,Math.round((Date.now()-W.ini)/6e4)),kg=lastKg()||70,k=Math.round(5*kg*m/60);
 S.log.push({f:ds(new Date()),m:m,g:W.meta,k:k});save();say("Terminaste. Buen trabajo.");$("play").className="";W=null;try{if(WL)WL.release()}catch(e){}
 ov('<div class="fin"><div class="big">🎉</div><h2>¡Listo!</h2><p>'+m+' min · unas '+k+' kcal</p><p class="slog">'+PH[Math.floor(Math.random()*PH.length)]+'</p><button class="wide main" data-a="cl">Cerrar</button></div>');conf();R()}
/* acciones */
var ACT={
 tab:function(v){S.tab=+v;R()},
 g:function(v){go(zl(v,ds(new Date())),zn(v).n)},
 hoy:function(){var p=plan().filter(function(x){return x.s==ds(new Date())})[0];go(zl(p.zona,p.s),zn(p.zona).n)},
 pd:function(v){var p=plan()[+v];if(!p.train){alert("Ese día toca descansar. Camina un poco y estírate.");return}go(zl(p.zona,p.s),zn(p.zona).n)},
 sorp:function(){var all=[];G.forEach(function(g){g.e.forEach(function(e){if(ok(e))all.push(e)})});go(shuf(all,Math.random).slice(0,6),"Sorpresa")},
 mi:function(){if(S.custom.length)go(cust(),"Mi rutina");else bld()},
 ed:function(){bld()},
 bs:function(){S.custom=[].map.call(document.querySelectorAll("#ov input:checked"),function(i){return i.value});save();cl();ACT.mi()},
 cl:function(){cl()},
 niv:function(v){S.nivel=+v;save();R()},
 voz:function(){S.voz=!S.voz;save();R()},
 re:function(){STP=0;ob()},
 del:function(){if(confirm("¿Borrar todo tu progreso y configuración?")){try{localStorage.removeItem("entrena2")}catch(e){}S=D();STP=0;R();ob()}},
 aw:function(){var k=parseFloat($("nw").value);if(!(k>25&&k<400))return;var t=ds(new Date()),l=S.pesos[S.pesos.length-1];if(l&&l.f==t)l.k=k;else S.pesos.push({f:t,k:k});save();R()},
 o:function(v){var s=OB[STP];if(s.multi){if(v==="")S.mol=[];else{var i=S.mol.indexOf(v);if(i>-1)S.mol.splice(i,1);else S.mol.push(v)}}else S[s.k]=s.k=="nivel"?+v:v;ob()},
 dd:function(v){S.dias=+v;S.ini=+$("ini").value;ob()},
 nx:function(){var s=OB[STP];
  if(s.k=="dias")S.ini=+$("ini").value;
  if(s.k=="cuerpo"){var kg=parseFloat($("kg").value),cm=parseFloat($("cm").value);if(kg>25&&kg<400){var t=ds(new Date()),l=S.pesos[S.pesos.length-1];if(l&&l.f==t)l.k=kg;else S.pesos.push({f:t,k:kg})}if(cm>90&&cm<250)S.alt=cm}
  if(STP<OB.length-1){STP++;ob()}else{save();gen()}},
 back:function(){if(STP>0){STP--;ob()}},
 skip:function(){save();gen()},
 pausa:function(){W.pause=!W.pause;$("pausa").textContent=W.pause?"Seguir":"Pausa"},
 salta:function(){next()},
 salir:function(){if(confirm("¿Salir del entrenamiento?")){clearInterval(T);W=null;$("play").className="";try{speechSynthesis.cancel();if(WL)WL.release()}catch(e){}}}};
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var f=ACT[b.dataset.a];if(f)f(b.dataset.v)});
document.addEventListener("change",function(e){if(e.target.id=="rs"){S.rest=e.target.value===""?null:+e.target.value;save()}});
R();if(!S.ob){STP=0;ob()}
</script>
